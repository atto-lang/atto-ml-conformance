name: ML host-reference oracles (not Oreslang guest conformance)
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  host-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run independent reference fixtures
        run: npm run test:oracle
      - name: Refuse actual compiler conformance claims
        run: |
          echo "HOST_ORACLE_ONLY: no Oreslang compiler or guest executed"
