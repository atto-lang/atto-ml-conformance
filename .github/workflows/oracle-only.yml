name: ML host-reference oracles (not Oreslang guest conformance)
on:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  node-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact authored source and clean tree
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'NODE_REFERENCE_SOURCE_COMMIT=%s\n' "$EXPECTED_SOURCE_SHA"
          printf 'NODE_REFERENCE_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - name: Execute Node reference oracles and provider contract checks
        run: npm test
      - name: Mark executed scope without promoting any guest backend
        run: |
          echo "HOST_REFERENCE_ONLY: Node reference tests; no Oreslang compiler or guest executed"

  rust-reference:
    # Rust evidence-status tests have an independent status from the Node
    # oracles. Missing dependency locking must not erase Node test evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact authored source and clean tree
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'RUST_REFERENCE_SOURCE_COMMIT=%s\n' "$EXPECTED_SOURCE_SHA"
          printf 'RUST_REFERENCE_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - name: Require reviewed root Cargo.lock before any Rust test
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s Cargo.lock; then
            echo "::error::ROOT_CARGO_LOCK_ABSENT: generate, review and commit the Cargo 1.95.0 root lockfile before Rust reference testing"
            exit 1
          fi
      - name: Verify pinned Rust toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
          test "$(cargo --version | awk '{print $2}')" = "1.95.0"
          echo "RUST_REFERENCE_TOOLCHAIN=1.95.0"
      - name: Execute locked Rust receipt-classification tests
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
      - name: Mark executed scope without promoting any guest backend
        run: |
          echo "HOST_REFERENCE_ONLY: Rust evidence-classification tests; no Oreslang compiler or guest executed"
