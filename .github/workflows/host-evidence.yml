name: ML exact-head host reference receipts (NOT guest conformance)
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  node-python-host-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head or pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run Node host references and provider contract tests
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/node-tap.log"
      - name: Run Python host reference and security tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/python-unittest.log"
      - name: Verify independent Python fixture oracle
        shell: bash
        run: |
          python3 scripts/check_reference.py fixtures/p0-v1.json
          printf 'REFERENCE_PASS\n' > "$RUNNER_TEMP/reference.ok"
      - name: Generate exact-head non-promotable host-only receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/host_receipt.py \
            --expected-sha "$EXPECTED_HEAD" \
            --node-log "$RUNNER_TEMP/node-tap.log" \
            --python-log "$RUNNER_TEMP/python-unittest.log" \
            --reference-marker "$RUNNER_TEMP/reference.ok" \
            --output build/host-only-receipt.json
          python3 -m json.tool build/host-only-receipt.json
      - name: Upload host-only receipt metadata (no source or logs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ml-host-only-exact-head-receipt
          path: build/host-only-receipt.json
          if-no-files-found: error
          retention-days: 7
