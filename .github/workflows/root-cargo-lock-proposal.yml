# Reviewer-only proposal. Runs in the source repository trust boundary.
# No repository writes, credentials, or cross-organization source placement.
name: ML root Cargo.lock source-local proposal (not a release gate)
on:
  push:
    paths:
      - '.github/workflows/root-cargo-lock-proposal.yml'
  pull_request:
    paths:
      - '.github/workflows/root-cargo-lock-proposal.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  propose-root-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact authored SHA checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and root manifest boundary
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          test -s Cargo.toml
          test -f rust-toolchain.toml
          test ! -e Cargo.lock
          test -f tools/rollout-evidence/Cargo.lock
          echo "LOCK_PROPOSAL_COMMIT=$EXPECTED_SOURCE_SHA"
          echo "LOCK_PROPOSAL_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install and check precise Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          test "$(cargo +1.95.0 --version | awk '{print $2}')" = 1.95.0
          test "$(rustc +1.95.0 --version | awk '{print $2}')" = 1.95.0
      - name: Generate root lockfile using actual Cargo resolver
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 generate-lockfile
          test -s Cargo.lock
          test "$(git ls-files --others --exclude-standard)" = Cargo.lock
          git diff --quiet HEAD -- Cargo.toml rust-toolchain.toml
          cargo +1.95.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/ml-root-lock-metadata.json"
      - name: Execute Rust host reference tests with generated locked graph
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --all-targets
          git diff --quiet HEAD -- Cargo.toml rust-toolchain.toml
      - name: Prepare limited-scope review receipt (not attestation)
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ml-root-lock-proposal"
          cp Cargo.lock "$RUNNER_TEMP/ml-root-lock-proposal/Cargo.lock"
          ( cd "$RUNNER_TEMP/ml-root-lock-proposal" && sha256sum Cargo.lock > Cargo.lock.sha256 )
          lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          printf '{"schema":"ores.ml-root-cargo-lock-proposal/v1","sourceSha":"%s","sourceTreeSha":"%s","toolchain":"1.95.0","lockSha256":"%s","classification":"SOURCE_LOCAL_LOCK_PROPOSAL_UNATTESTED","guestExecuted":false,"releaseReady":false}\n' \
            "$SOURCE_SHA" "$source_tree" "$lock_sha" > "$RUNNER_TEMP/ml-root-lock-proposal/receipt.json"
      - name: Upload only proposed lockfile and source-local review receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ml-root-cargo-lock-proposal
          path: |
            ${{ runner.temp }}/ml-root-lock-proposal/Cargo.lock
            ${{ runner.temp }}/ml-root-lock-proposal/Cargo.lock.sha256
            ${{ runner.temp }}/ml-root-lock-proposal/receipt.json
          if-no-files-found: error
          retention-days: 1
