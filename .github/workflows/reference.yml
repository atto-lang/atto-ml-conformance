name: ML reference oracle (not Oreslang execution)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_reference.py fixtures/p0-v1.json
